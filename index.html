<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Buscador de Digimon</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="estilos.css" />
</head>
<body>

  <div class="container my-4">
    <h1 class="text-center mb-4">Buscador de Digimon</h1>

    <div class="row mb-3 justify-content-center">
      <div class="col-md-5 mb-2">
        <input type="text" id="inputBuscar" class="form-control" placeholder="Buscar por nombre o nivel" />
      </div>
      <div class="col-md-3 mb-2">
        <select id="tipoBusqueda" class="form-select">
          <option value="name">Por nombre</option>
          <option value="level">Por nivel</option>
        </select>
      </div>
      <div class="col-md-2 mb-2">
        <button id="btnBuscar" class="btn btn-primary w-100">Buscar</button>
      </div>
    </div>

    <div class="table-responsive">
      <table id="tablaResultados" class="table table-striped table-bordered text-center">
        <thead class="table-primary">
          <tr>
            <th>Nombre</th>
            <th>Nivel</th>
          </tr>
        </thead>
        <tbody>

        </tbody>
      </table>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="buscador.js"></script>
</body>
</html>
