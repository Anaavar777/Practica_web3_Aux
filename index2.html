<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Galería de Pokémon</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="estilos2.css" rel="stylesheet" />
</head>
<body>
  <div class="container py-4">
    <h1 class="mb-4 text-center">Galería de Pokémon</h1>
    <div class="row mb-3">
      <div class="col-md-6 mx-auto">
        <input id="filterInput" type="text" class="form-control" placeholder="Filtrar por nombre..." />
      </div>
    </div>
    <div id="pokemonGallery" class="row gy-4"></div>
    <nav>
      <ul class="pagination justify-content-center mt-4">
        <li class="page-item" id="prevPage"><button class="page-link">Anterior</button></li>
        <li class="page-item" id="nextPage"><button class="page-link">Siguiente</button></li>
      </ul>
    </nav>
  </div>
  <script src="galeria.js"></script>
</body>
</html>
